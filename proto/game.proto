// 4단계 게임 메시지. 규칙과 처리 순서는 docs/stage4.md가 기준이다.
syntax = "proto3";
package game.protocol;

// 업무 규칙 위반을 알리는 결과 코드. 프로토콜 위반(잘못된 길이, 알 수 없는 ID, 파싱 실패)은
// 이 코드를 쓰지 않고 연결을 종료한다.
enum GameResult {
  GAME_OK = 0;
  GAME_INVALID_NICKNAME = 1;   // 닉네임 규칙 위반 (채팅과 같은 규칙)
  GAME_INVALID_ROOM_CODE = 2;  // 방 코드가 숫자 6자리가 아님
  GAME_ROOM_NOT_FOUND = 3;     // 그 코드의 방이 없음
  GAME_ROOM_FULL = 4;          // 방이 가득 참 (최대 4명)
  GAME_ALREADY_IN_ROOM = 5;    // 이미 방에 있는 연결이 만들기/입장
  GAME_NOT_IN_ROOM = 6;        // 방에 없는 연결이 나가기
  GAME_NICKNAME_TAKEN = 7;     // 같은 방에 같은 닉네임이 이미 있음
  GAME_SERVER_BUSY = 8;        // 방 수 상한, 방 코드 발급 실패
  // 자원 채집 (docs/stage4-gather.md)
  GAME_NODE_NOT_FOUND = 9;     // 그 번호의 자원 노드가 없음
  GAME_NODE_DEPLETED = 10;     // 노드가 고갈되어 재생을 기다리는 중
  GAME_TOO_FAR = 11;           // 서버가 아는 내 위치에서 채집 허용 거리 밖
  GAME_GATHER_COOLDOWN = 12;   // 채집 쿨다운 중
  // 건설 (docs/content-roadmap.md)
  GAME_BUILD_INVALID_TYPE = 13;     // 모르는 건물 종류
  GAME_BUILD_BLOCKED = 14;          // 맵 밖이거나 구조물, 노드, 플레이어와 겹침, 잘못된 좌표
  GAME_NOT_ENOUGH_RESOURCES = 15;   // 비용(목재, 석재)이 모자람
  GAME_BUILD_TOO_FAR = 16;          // 서버가 아는 내 위치에서 건설 허용 거리 밖
  GAME_STRUCTURE_LIMIT = 17;        // 방의 구조물 수 상한
  GAME_BUILD_OUT_OF_ZONE = 18;      // 건물이 건설 구역(맵 중앙 정사각형) 밖으로 나감
  // 농장 저장 (docs/persistence.md)
  GAME_LOGIN_REQUIRED = 19;         // 농장 방에는 로그인한 사람만 입장할 수 있다
  GAME_STORAGE_UNAVAILABLE = 20;    // 농장을 불러오거나 만들지 못함(저장소 오류, 시간 초과)
  // 하루와 잠 (docs/content-day.md)
  GAME_SLEEP_TOO_FAR = 21;          // 시작 집이나 완공된 집 앞(sleep_range_cm 안)이 아니다
  GAME_SLEEPING = 22;               // 잠든 상태에서는 채집과 건설을 할 수 없다
}

enum StructureType {
  STRUCTURE_HOUSE = 0;
}

enum StructureState {
  STRUCTURE_BUILDING = 0;  // 건설 중(충돌은 처음부터 있다)
  STRUCTURE_COMPLETE = 1;
}

// 맵에 놓인 건물 하나. 축에 정렬된 직사각형이며 (x, y)는 중심이다.
message Structure {
  uint32 structure_id = 1;  // 방 안에서 1부터 부여, 방이 닫힐 때까지 같다
  StructureType type = 2;
  float x = 3;              // 중심, cm
  float y = 4;
  float width = 5;          // cm (x 방향)
  float height = 6;         // cm (y 방향)
  StructureState state = 7;
  uint64 ready_tick = 8;    // 건설 중이면 0(다음 밤 정산에 완료), 완료되었으면 완료된 틱 (docs/content-day.md에서 뜻이 바뀜)
}

message PlayerInfo {
  uint32 player_id = 1;  // 방 안에서 부여한 번호. 방이 닫힐 때까지 유지, 재사용 안 함
  string nickname = 2;
}

enum ResourceKind {
  RESOURCE_TREE = 0;  // 채집하면 목재
  RESOURCE_ROCK = 1;  // 채집하면 석재
}

// 맵에 있는 자원 노드 하나. 종류는 방이 닫힐 때까지 같고, 체력이 바뀐다. 위치는 처음 배치 뒤에는 재생할 때만 바뀐다.
message ResourceNode {
  uint32 node_id = 1;  // 방 안에서 1부터 부여, 방이 닫힐 때까지 같다
  ResourceKind kind = 2;
  float x = 3;         // cm
  float y = 4;         // cm
  uint32 hp = 5;       // 남은 체력. 0이면 고갈(재생을 기다리는 중)
  uint32 max_hp = 6;
}

// 방의 시계 (docs/content-day.md). 클라이언트는 받은 스냅샷 틱으로 elapsed = tick - day_start_tick을 계산해 시각을 그린다.
// 게임 시각(자정부터 센 분) = day_start_minute + elapsed / ticks_per_game_minute.
message DayClock {
  uint32 day = 1;                    // 1부터
  int64 day_start_tick = 2;          // 그날이 시작된 월드 틱. 저장된 농장을 열면 음수일 수 있다
  uint32 day_length_ticks = 3;       // 하루의 틱 수 (기본 12000)
  uint32 ticks_per_game_minute = 4;  // 기본 10
  uint32 day_start_minute = 5;       // 기본 360 (06:00)
}

enum LandmarkKind {
  LANDMARK_FARMHOUSE = 0;  // 시작 집. 조각 4에서 출하 상자, 상점이 더해진다
}

// 모든 방의 같은 자리에 있는 고정 물체. 축에 정렬된 직사각형이고 (x, y)는 중심이다.
message Landmark {
  LandmarkKind kind = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
}

// 방 전체의 현재 상태. 만들기/입장 응답에 담긴다.
message RoomState {
  string room_code = 1;          // 숫자 6자리 문자열 (앞자리가 0일 수 있음)
  uint32 your_player_id = 2;
  uint32 host_player_id = 3;
  repeated PlayerInfo players = 4;  // 나를 포함한 현재 접속자 (입장한 순서)
  repeated ResourceNode nodes = 5;  // 방의 모든 자원 노드와 현재 체력
  repeated Structure structures = 6;  // 방의 모든 구조물(건설 중 포함)
  DayClock clock = 7;                 // 방의 시계(늦게 들어온 사람도 지금 시각을 안다)
  repeated Landmark landmarks = 8;    // 고정 물체(시작 집)
  repeated uint32 sleeping_player_ids = 9;  // 지금 잠든 사람(입장한 순서)
}

message CreateRoomRequest { string nickname = 1; }
message CreateRoomResponse {
  GameResult result = 1;
  RoomState state = 2;  // result가 GAME_OK일 때만 채워진다
  // 들어간 직후의 내 인벤토리. 농장이면 예전에 저장된 값이 복원되어 있다(임시 방은 0).
  uint32 wood = 3;
  uint32 stone = 4;
}

message JoinRoomRequest {
  string room_code = 1;
  string nickname = 2;
}
message JoinRoomResponse {
  GameResult result = 1;
  RoomState state = 2;  // result가 GAME_OK일 때만 채워진다
  // 들어간 직후의 내 인벤토리. 농장이면 예전에 저장된 값이 복원되어 있다(임시 방은 0).
  uint32 wood = 3;
  uint32 stone = 4;
}

message LeaveRoomRequest {}
message LeaveRoomResponse { GameResult result = 1; }

// 이동 입력. 응답은 없다. 방향은 월드 좌표축 기준이며 길이가 1을 넘으면 서버가 1로 줄인다.
// (0, 0)을 보내면 정지한다. 서버는 다음 입력이 올 때까지 마지막 방향으로 계속 움직인다.
message MoveInput {
  uint32 sequence = 1;  // 클라이언트가 올리는 번호. 이전 값 이하이면 서버가 무시한다.
  float dir_x = 2;
  float dir_y = 3;
}

// 방 안의 변화를 알린다.
message RoomEvent {
  enum Kind {
    PLAYER_JOINED = 0;  // player에 입장한 사람
    PLAYER_LEFT = 1;    // player에 나간 사람
    HOST_CHANGED = 2;   // host_player_id가 새 방장
  }
  Kind kind = 1;
  PlayerInfo player = 2;
  uint32 host_player_id = 3;  // 항상 채워진다(현재 방장)
}

message PlayerState {
  uint32 player_id = 1;
  float x = 2;                   // cm
  float y = 3;                   // cm
  uint32 last_input_seq = 4;     // 서버가 마지막으로 반영한 이 플레이어의 입력 번호 (없으면 0)
}

// 자원 노드를 한 번 친다. 서버가 서버가 아는 내 위치, 거리, 쿨다운을 판정한다.
message GatherRequest { uint32 node_id = 1; }
// 결과와 내 인벤토리 합계(성공/실패 모두 현재 값).
message GatherResponse {
  GameResult result = 1;
  uint32 node_id = 2;
  uint32 wood = 3;
  uint32 stone = 4;
}

message ResourceNodeState {
  uint32 node_id = 1;
  uint32 hp = 2;  // 0이면 고갈
  float x = 3;    // 재생으로 자리가 바뀌었을 수 있으므로 위치도 함께 보낸다(cm)
  float y = 4;
}

// 한 틱 동안 체력이 바뀐 노드만 모아 방 전원에게 보낸다(채집한 본인 포함). 바뀐 것이 없으면 보내지 않는다.
message ResourceUpdate {
  uint64 tick = 1;
  repeated ResourceNodeState nodes = 2;
}

// 건물을 짓는다. (x, y)는 짓고 싶은 중심이며 서버가 격자에 맞춘다. 서버가 거리, 겹침, 비용을 판정한다.
message BuildRequest {
  StructureType structure_type = 1;
  float x = 2;
  float y = 3;
}
// 결과와 내 인벤토리 합계(성공/실패 모두 현재 값). 성공하면 structure_id가 채워진다.
message BuildResponse {
  GameResult result = 1;
  uint32 structure_id = 2;
  uint32 wood = 3;
  uint32 stone = 4;
}

// 한 틱 동안 새로 생기거나 상태가 바뀐 구조물을 방 전원에게 보낸다(건설한 본인 포함). 바뀐 것이 없으면 보내지 않는다.
message StructureUpdate {
  uint64 tick = 1;
  repeated Structure structures = 2;
}

// 틱마다 방 전체 상태를 보낸다.
message WorldSnapshot {
  uint64 tick = 1;
  repeated PlayerState players = 2;
}

// ---- 하루와 잠 (docs/content-day.md) ----

// 잔다(true) 또는 깬다(false). 잘 수 있는 곳은 시작 집이나 완공된 집 앞(sleep_range_cm 안)이다.
message SleepRequest { bool sleep = 1; }
// 결과와 요청 뒤의 내 잠 상태(성공/실패 모두 현재 값).
message SleepResponse {
  GameResult result = 1;
  bool sleeping = 2;
}

// 잠든 사람 목록이 바뀐 틱에만 방 전원(본인 포함)에게 보낸다. 현재 잠든 사람 전부(입장한 순서).
message SleepUpdate {
  uint64 tick = 1;
  repeated uint32 sleeping_player_ids = 2;
}

// 밤 정산이 끝나고 새 날이 시작되었다. 그 틱에 방 전원이 다른 메시지보다 먼저 받는다.
// 클라이언트는 이것을 받으면 보간을 초기화한다(아침 위치로의 순간이동을 미끄러지듯 그리지 않게).
message DayStarted {
  uint64 tick = 1;
  DayClock clock = 2;
  bool forced = 3;  // 02:00 강제 정산이면 true, 모두 잠들어 넘어갔으면 false
}
